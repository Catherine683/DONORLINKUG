envVarGroups:
  - name: donorlink-production
    envVars:
      - key: APP_NAME
        value: DonorLink UG
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Africa/Kampala
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: TRUSTED_PROXIES
        value: "*"
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: DonorLink UG
      - key: DONORLINK_MAIL_DAILY_BUDGET
        value: "250"
      - key: DONORLINK_MAIL_TRANSACTIONAL_RESERVE
        value: "100"
      - key: DONORLINK_MAIL_ANNOUNCEMENT_CHUNK
        value: "40"

services:
  - type: web
    name: donorlink-web
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    preDeployCommand: php artisan migrate --force
    envVars:
      - fromGroup: donorlink-production

  - type: worker
    name: donorlink-queue
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan queue:work database --sleep=3 --tries=3 --timeout=90
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: donorlink-production

  - type: cron
    name: donorlink-scheduler
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: php artisan schedule:run
    schedule: "* * * * *"
    envVars:
      - fromGroup: donorlink-production
